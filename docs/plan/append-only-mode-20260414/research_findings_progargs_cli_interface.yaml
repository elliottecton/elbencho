patterns_found:
  - category: boolean_flag_registration
    pattern: bpo::bool_switch bound to a bool member defaulted to false
    description: >
      All on/off mode flags follow this exact pattern:
      1. Declare `bool memberName;` in private section of ProgArgs class.
      2. Default to false in defineDefaults(): `this->memberName = false;`
      3. Register in defineAllowedArgs(): `(ARG_MACRO_LONG, bpo::bool_switch(&this->memberName), "help text")`
      4. Add getter in public inliners section: `bool getMemberName() const { return memberName; }`
      No short form needed for boolean flags (and typically not used).
    examples:
      - file: source/ProgArgs.cpp
        location: "~771"
        snippet: |
          (ARG_TRUNCATE_LONG, bpo::bool_switch(&this->doTruncate),
              "Truncate files to 0 size when opening for writing.")
      - file: source/ProgArgs.cpp
        location: "~240"
        snippet: |
          (ARG_DIRECTIO_LONG, bpo::bool_switch(&this->useDirectIO),
              "Use direct IO (also known as O_DIRECT) ...")
    prevalence: common

  - category: value_with_unit_string
    pattern: Pair of *OrigStr + numeric member, converted in convertUnitStrings()
    description: >
      Arguments that accept human-readable sizes/counts (e.g. "4K", "2M") always bind
      to a std::string *OrigStr member. The numeric member is populated later via
      UnitTk::numHumanToBytesBinary() in convertUnitStrings().
    examples:
      - file: source/ProgArgs.cpp
        location: "523"
        snippet: |
          (ARG_FILESIZE_LONG "," ARG_FILESIZE_SHORT, bpo::value(&this->fileSizeOrigStr), ...)
          // then in convertUnitStrings():
          fileSize = UnitTk::numHumanToBytesBinary(fileSizeOrigStr, false);
    prevalence: common

  - category: arg_conflict_validation
    pattern: throw ProgException in checkArgs() / checkPathDependentArgs()
    description: >
      All validation errors throw ProgException with a descriptive string. No return codes.
      Mutually exclusive combinations are checked with simple boolean && logic.
    examples:
      - file: source/ProgArgs.cpp
        location: "~1240"
        snippet: |
          if( (useRandomOffsets + useStridedAccess + doReverseSeqOffsets) > 1)
              throw ProgException("Random, strided and reverse sequence offsets cannot be "
                  "used together.");
    prevalence: common

  - category: implicit_value_derivation
    pattern: initImplicitValues() sets members derived from combinations of other flags
    description: >
      When one flag implies another, or two flags together produce a third value,
      this is done in initImplicitValues() using argsVariablesMap.count() to detect
      explicit user intent vs defaults.
    examples:
      - file: source/ProgArgs.cpp
        location: "~990"
        snippet: |
          if(argsVariablesMap.count(ARG_RWMIXPERCENT_LONG) )
              useRWMixPercent = true;
    prevalence: occasional

  - category: naming_conventions_bool_flags
    pattern: Prefix-based naming for boolean members
    description: >
      - `run*` prefix: phases to execute (runCreateFilesPhase, runReadPhase, etc.)
      - `do*` prefix: modifiers for how a phase runs (doTruncate, doDirectVerify, doReadInline)
      - `use*` prefix: enabling alternative IO/access modes (useDirectIO, useRandomOffsets)
      - `show*` prefix: output/display toggles (showLatency, showCPUUtilization)
      - `ignore*` prefix: error suppression (ignoreDelErrors, ignoreS3Errors)
      An append-only mode flag would most likely use the `do*` or `use*` prefix (e.g. `doAppendOnly`
      or `useAppendOnly`) based on existing conventions.
    examples:
      - file: source/ProgArgs.h
        location: "~370-510"
        snippet: "bool doTruncate; bool useDirectIO; bool runCreateFilesPhase;"
    prevalence: common

related_architecture:
  components_relevant_to_domain:
    - component: WorkersSharedData
      responsibility: Shared mutable state and configuration pointer for all worker threads
      location: source/workers/WorkersSharedData.h
      relationship_to_domain: holds ProgArgs* progArgs; all workers reach config through this
    - component: Worker (base class)
      responsibility: Base class for LocalWorker and RemoteWorker
      location: source/workers/Worker.h
      relationship_to_domain: caches progArgs pointer shortcut; subclasses call progArgs->getX()
    - component: WorkerManager
      responsibility: Creates threads, assigns shared data, runs phases
      location: source/workers/WorkerManager.cpp
      relationship_to_domain: performs workersSharedData.progArgs = &progArgs assignment

  interfaces_used_by_domain:
    - interface: boost::program_options (bpo)
      location: external library
      usage_pattern: >
        bpo::options_description + bpo::bool_switch() for flags,
        bpo::value<T>() for typed arguments.
    - interface: ProgException
      location: source/ProgException.h
      usage_pattern: thrown on validation failures in checkArgs() and checkPathDependentArgs()
    - interface: UnitTk::numHumanToBytesBinary
      location: source/toolkits/UnitTk.h
      usage_pattern: converts "4K", "2M" strings to numeric bytes/count

  data_flow_involving_domain: >
    CLI args -> bpo::store/notify -> member vars set (defaults + parsed values) ->
    initImplicitValues() -> convertUnitStrings() -> checkArgs() ->
    ProgArgs object stored in Coordinator -> pointer set in WorkersSharedData ->
    Workers read via progArgs->getXxx() calls during phase execution.

  key_relationships_to_domain:
    - from: WorkerManager
      to: ProgArgs
      relationship: holds reference; sets pointer in WorkersSharedData
    - from: Worker (all subclasses)
      to: ProgArgs
      relationship: reads via cached pointer; no writes except setS3InterruptionRequested
    - from: Statistics
      to: ProgArgs
      relationship: reads many config values for results output

related_technology_stack:
  languages_used_in_domain:
    - C++17
  frameworks_used_in_domain:
    - name: boost::program_options
      usage_in_domain: >
        Entire CLI parsing layer. bpo::options_description holds all arg definitions.
        bpo::variables_map used to check whether args were explicitly set vs defaulted
        (via .count() -- critical for bool_switch flags which are always present).
    - name: boost::property_tree
      usage_in_domain: >
        Serialization of ProgArgs for service mode (getAsPropertyTreeForService /
        setFromPropertyTreeForService). Any new flag needing distributed mode support
        must be added here.
  libraries_used_in_domain:
    - name: UnitTk (internal)
      purpose_in_domain: Human-readable unit string to numeric conversion

related_conventions:
  naming_patterns_in_domain: >
    ARG macros: ARG_<UPPERCASENAME>_LONG and optionally ARG_<...>_SHORT.
    Member variables: camelCase with prefix (do*, use*, run*, show*, ignore*).
    Getters: get<CamelCaseMemberName>() as const inliners in ProgArgs.h.
    Setters: rare; only exists for timeLimitSecs and ignoreDelErrors.
  structure_of_domain: >
    Constructor calls: defineDefaults() -> defineAllowedArgs() -> bpo::store/notify ->
    config file load (if any) -> initImplicitValues() -> convertUnitStrings() ->
    checkCSVFileCompatibility() -> checkArgs().
    All validation is in checkArgs() and checkPathDependentArgs().
  error_handling_in_domain: >
    All errors throw ProgException (unchecked, propagates to main()).
    Soft warnings use LOGGER(Log_NORMAL, "NOTE: ..." << std::endl).
  testing_in_domain: "No dedicated unit tests found for ProgArgs; covered by integration tests."
  documentation_in_domain: >
    In-code comments on member declarations. Help text is the primary user doc (printed via
    boost::program_options). ARG macro naming includes a max length comment at the top of ProgArgs.h.

related_dependencies:
  internal:
    - component: ProgException
      relationship_to_domain: error signaling from validation
      direction: outbound
    - component: UnitTk
      relationship_to_domain: unit string conversion
      direction: outbound
    - component: TranslatorTk
      relationship_to_domain: fadvise/madvise/flock flag string to numeric conversion
      direction: outbound
    - component: SystemTk

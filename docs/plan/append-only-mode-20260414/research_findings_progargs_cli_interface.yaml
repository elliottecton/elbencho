plan_id: append-only-mode-20260414
objective: >
  Understand how CLI arguments are defined and parsed in elbencho so we can
  add new --append-only (or similar) flags.
focus_area: progargs_cli_interface
created_at: "2026-04-14"
created_by: gem-researcher
status: completed

tldr: |
  - All CLI argument registration lives in ProgArgs::defineAllowedArgs() using boost::program_options.
  - Boolean flags use bpo::bool_switch(&this->member); no value token needed -- presence sets true.
  - Boolean defaults are set in defineDefaults() (constructor calls this before defineAllowedArgs).
  - The exact pattern for adding a new bool flag is: declare member -> initialize in defineDefaults() ->
    register in defineAllowedArgs() -> add getter inliner in ProgArgs.h public section.
  - No existing --append, doAppend, or O_APPEND flag in the write path; O_APPEND only appears in
    log/results file opens (HTTPService.cpp, Statistics.cpp, OpsLogger.cpp).
  - Workers access ProgArgs exclusively via a raw pointer stored in WorkersSharedData and mirrored
    as a shortcut in Worker base class; no value copying.
  - New flags for distributed mode MUST be added to getAsPropertyTreeForService() and
    setFromPropertyTreeForService() to be serialized/deserialized to remote service instances.

research_metadata:
  methodology: >
    Full read of ProgArgs.h (all ~810 lines) and ProgArgs.cpp (sections covering
    defineAllowedArgs, defineDefaults, initImplicitValues, convertUnitStrings, checkArgs,
    checkPathDependentArgs). Targeted grep searches for timelimit, fileSize, numFiles/numDirs,
    O_APPEND, and ProgArgs pointer usage in workers. Spot reads of WorkersSharedData.h and Worker.h.
  tools_used:
    - read_file
    - grep_search (via run_in_terminal)
  scope: >
    Full depth on ProgArgs.h and ProgArgs.cpp; spot reads on workers/WorkersSharedData.h,
    workers/Worker.h, workers/WorkerManager.cpp.
  confidence: high
  coverage: 95


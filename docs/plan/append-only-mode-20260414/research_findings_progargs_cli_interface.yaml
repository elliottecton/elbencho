boolean_flag_pattern:
  step1_declare: >
    In ProgArgs class private section (source/ProgArgs.h, after existing bool members,
    maintain alphabetical order within naming prefix group):
      bool doAppendOnly;  // open files with O_APPEND for write phase
  step2_default: >
    In ProgArgs::defineDefaults() (source/ProgArgs.cpp, ~line 818):
      this->doAppendOnly = false;
  step3_define_macro: >
    In ProgArgs.h ARG macro section (alphabetically):
      #define ARG_APPENDONLY_LONG  "appendonly"
  step4_register: >
    In ProgArgs::defineAllowedArgs() (source/ProgArgs.cpp), insert in alphabetical order
    (after /*al*/ block, before /*b*/ block):
      (ARG_APPENDONLY_LONG, bpo::bool_switch(&this->doAppendOnly),
          "Open files with O_APPEND flag in write phase. Each write appends to end of file.")
  step5_getter: >
    In ProgArgs public inliners section (source/ProgArgs.h), maintain alphabetical order:
      bool getDoAppendOnly() const { return doAppendOnly; }
  step6_service_serialization: >
    If distributed mode support needed, add to:
    - ProgArgs::getAsPropertyTreeForService(): tree.put("doAppendOnly", doAppendOnly)
    - ProgArgs::setFromPropertyTreeForService(): doAppendOnly = tree.get("doAppendOnly", false)
  step7_validation: >
    In ProgArgs::checkArgs() (source/ProgArgs.cpp, ~line 1250), add conflict checks e.g.:
      if(doAppendOnly && useRandomOffsets)
          throw ProgException("Append-only mode cannot be used with random offsets.");
      if(doAppendOnly && doTruncate)
          throw ProgException("Append-only mode cannot be used with --trunc.");
  step8_worker_usage: >
    In worker write-path code (LocalWorker), call progArgs->getDoAppendOnly() to
    conditionally add O_APPEND to the open() flags.

existing_append_related_arguments: []
# No doAppend, useAppend, appendOnly, or O_APPEND in write-path code.
# O_APPEND appears only in:
#   - source/HTTPService.cpp:49 (log file open)
#   - source/Statistics.cpp:2540 (CSV results file open)
#   - source/toolkits/OpsLogger.cpp:19 (ops log file open)
# None of these are in the benchmark write path.

progargs_worker_access_pattern:
  storage: "Raw pointer ProgArgs* in WorkersSharedData::progArgs (source/workers/WorkersSharedData.h:40)"
  assignment: "workersSharedData.progArgs = &progArgs; in WorkerManager (source/workers/WorkerManager.cpp:150)"
  worker_shortcut: "ProgArgs* progArgs; in Worker base class (source/workers/Worker.h:40), initialized from workersSharedData->progArgs"
  access_pattern: "Workers call progArgs->getXxx() const getters. No value copying. No ownership."
  thread_safety: >
    ProgArgs is read-only after construction (workers only call const getters), except for
    setS3InterruptionRequested() which is atomic-bool-backed, and setTimeLimitSecs() called
    only from WorkerManager before/after phase transitions (not during).

validation_entry_points:
  primary: "ProgArgs::checkArgs() -- source/ProgArgs.cpp:~1116"
  secondary: "ProgArgs::checkPathDependentArgs() -- source/ProgArgs.cpp:~1340 (called from checkArgs, after bench path type is known)"
  pattern: "throw ProgException(\"message\") for hard errors; LOGGER(Log_NORMAL, \"NOTE: ...\") for soft warnings"

open_questions:
  - question: >
      Does the append-only mode need to work in custom tree mode (treefile)?
    context: >
      Custom tree mode uses different file-open code paths in LocalWorker. The append behavior
      would need to be verified there as well.
  - question: >
      Should append-only imply a file size of 0 (no-truncate behavior) or should it be
      orthogonal to --size?
    context: >
      doTruncate and doTruncToSize are existing flags that control file size at open time.
      O_APPEND semantics do not truncate. A conflict check may be needed.
  - question: >
      Should append-only work in S3 mode?
    context: >
      S3 does not natively support append; it would need to be blocked or silently ignored.
      The pattern exists in checkArgs(): if(doSomething && !s3EndpointsStr.empty()) throw ...
  - question: >
      Is distributed mode (service/master) support required?
    context: >
      If so, the flag must be added to getAsPropertyTreeForService() and
      setFromPropertyTreeForService(). Searching for those methods was out of scope for this pass.

gaps:
  - area: LocalWorker write-path file-open code
    description: >
      Did not read LocalWorker.cpp to confirm exact location(s) where open() / O_WRONLY flags
      are constructed. Multiple open call sites likely exist (dir mode vs file/bdev mode vs
      inline read/write mode).
    impact: >
      The exact lines to modify in LocalWorker to add O_APPEND are not yet identified.
      A second research pass or targeted grep (O_WRONLY, O_CREAT in LocalWorker.cpp) is needed
      before implementation.
  - area: getAsPropertyTreeForService / setFromPropertyTreeForService
    description: >
      Did not read serialization methods to confirm their structure and how to add a new field.
    impact: >
      Only impacts distributed mode. For local-only initial implementation this can be deferred.
  - area: Configuration file support
    description: >
      Config file support is handled transparently by boost::program_options (same options as CLI
      are accepted). No separate action needed unless there is custom parsing.
    impact: Low -- no gap for standard flag registration.

related_conventions:
  naming_patterns_in_domain: >
    Functions taking a phase-dependent action are stored as function pointers (funcRWBlockSized,
    funcPositionalWrite, etc.) and selected in initPhaseFunctionPointers(). Phase-level init
    follows initPhase*() naming.
  structure_of_domain: >
    Each LocalWorker is a single thread. Phase dispatch happens in run() switch statement.
    Per-file open/prep is done in dirModeOpenAndPrepFile(); IO is in rwBlockSized().
    All mutable per-file state (fd, cuFileHandle, mmapPtr) lives in fileHandles struct.
  error_handling_in_domain: >
    Worker errors throw WorkerException. Short writes are checked post-call and throw.
    WorkerInterruptedException is a separate class that flows up through run() without
    incrementing the error counter.
  testing_in_domain: Covered by tools/test-examples.sh (shell-based integration tests, no unit tests).
  documentation_in_domain: docs/csv-docs.md, docs/result-columns-explanation.md, docs/usage/help*.md.

related_dependencies:
  internal:
    - component: ProgArgs
      relationship_to_domain: Supplies all config parameters (fileSize, blockSize, flags)
      direction: inbound
    - component: OffsetGenerator hierarchy
      relationship_to_domain: Drives write offset and termination for rwBlockSized
      direction: inbound
    - component: WorkerManager / WorkersSharedData
      relationship_to_domain: Controls phase start/stop and interruption
      direction: inbound
  external:
    - name: POSIX pwrite
      purpose_for_domain: Core write syscall
    - name: posix_fallocate / ftruncate
      purpose_for_domain: Pre-flight file sizing before write loop

open_questions:
  - question: >
      For append-only mode, should file size tracking be per-file or per-worker?
    context: >
      In dir mode, one file is open at a time per worker. If a worker appends for a
      duration and then closes, file sizes will differ across workers. Stats tracking
      (atomicLiveOps.numBytesDone) aggregates bytes written across all files -- this
      should still work, but the per-file "total" reported in results may be ambiguous.

  - question: >
      Does the short-write validation in dirModeIterateFiles and fileModeIterateFilesSeq
      need to be suppressed entirely, or just changed to "any write is acceptable"?
    context: >
      The current check is: IF_UNLIKELY( (size_t)writeRes != fileSize). In append mode
      the write loop will be interrupted mid-file, making writeRes < fileSize. The check
      must be either removed or conditioned on !doAppendOnly.

  - question: >
      Should O_APPEND be set, or should the new mode track the current end-of-file offset
      explicitly (via fstat or a local variable) and pass it to pwrite()?
    context: >
      O_APPEND makes the kernel atomically append but means pwrite() ignores the supplied
      offset. The offset generator infrastructure would not work with O_APPEND. The cleanest
      approach is probably a new OffsetGenUnbounded that grows currentOffset each call
      without a numBytesLeft limit, letting the time-limit interrupt mechanism stop it.

  - question: >
      Should ftruncate / fallocate be skipped entirely for append-only files, or should
      a starting size still be committed?
    context: >
      Currently doTruncToSize calls ftruncate(fd, fileSize) before the write loop.
      In append-only mode there is no meaningful pre-known "fileSize", so this should
      be skipped. The file should start at 0 bytes (or its current size if pre-existing).

  - question: >
      How are results reported when different workers write different amounts?
    context: >
      The stonewall mechanism records stats when the first worker finishes. In append-only
      + time-limited mode, all workers are interrupted at the same time, so stonewall
      will fire when the first worker processes the interrupt signal. Results should
      still be valid aggregate bytes-per-second, but per-file size will vary.

gaps:
  - area: aioBlockSized (libaio async path)
    description: >
      aioBlockSized was not read line-by-line. It was confirmed to use the same
      OffsetGenerator-driven loop and the same checkInterruptionRequest() mechanism.
      The precise async submission/reaping loop and any differences in short-write
      handling were not verified.
    impact: >
      Append-only mode may need the same modifications in aioBlockSized as in rwBlockSized.
      Low risk -- the same offset gen is shared, so the termination change should
      propagate naturally.

  - area: S3 and HDFS write paths
    description: >
      s3ModeIterateObjects() and hdfsDirModeIterateFiles() were not analyzed. They have
      different object/file semantics and likely different size handling.
    impact: >
      Append-only mode is likely a POSIX filesystem feature only. S3/HDFS paths are
      out of scope for append-only mode and can be explicitly excluded via a check
      against benchPathType / getS3EndpointsVec().empty().

  - area: Custom tree mode (dirModeIterateCustomFiles)
    description: >
      dirModeIterateCustomFiles() was not read in detail. It uses a PathStore-based
      iteration over an explicit file list rather than generated names.
    impact: >
      Append-only mode might be incompatible with custom tree mode (where file sizes
      may be pre-specified per-file). Low priority for initial implementation.

  - area: ProgArgs::prepareFileSize in file/bdev mode
    description: >
      This function validates that fileSize > 0 and that existing files are >= fileSize.
      These validations will reject a "fileSize=0 means unbounded" approach.
    impact: >
      Append-only mode must either add a new "noFileSize" flag that bypasses these checks,
      or validate that --timelimit is set and skip the file-size checks when doAppendOnly is true.

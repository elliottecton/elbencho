    description: |
      Build the modified elbencho binary and run a two-stage smoke test.

      **Build:**
        cd <workspace_root>
        make clean && make -j$(nproc) 2>&1 | tee /tmp/elbencho-build.log
      Confirm: zero errors, zero new warnings introduced by the changed files.

      **Smoke test -- append-only:**
        mkdir -p /tmp/elbench-append-test
        ./bin/elbencho --appendonly --timelimit 5 -n 4 --block 1m \
          /tmp/elbench-append-test 2>&1 | tee /tmp/elbencho-smoke-append.log
      Confirm:
        - Exits cleanly after ~5 seconds
        - Reports non-zero throughput and total bytes
        - Files exist in /tmp/elbench-append-test and are non-empty
        - No ASSERT, abort, or segfault in output

      **Smoke test -- regression (normal write):**
        mkdir -p /tmp/elbench-normal-test
        ./bin/elbencho -w -s 64m -n 4 --block 1m \
          /tmp/elbench-normal-test 2>&1 | tee /tmp/elbencho-smoke-normal.log
      Confirm: completes normally with correct file sizes (4 x 64 MiB).

      **Error path test:**
        ./bin/elbencho --appendonly -n 1 /tmp/elbench-append-test
      Confirm: exits with non-zero code and prints a message containing "timelimit".

      **Cleanup:**
        rm -rf /tmp/elbench-append-test /tmp/elbench-normal-test
    acceptance_criteria:
      - `make -j` completes with zero errors and zero new warnings.
      - Append-only smoke test exits cleanly with non-zero throughput reported.
      - Normal write regression test produces files of expected size.
      - Missing --timelimit error path prints a useful message and returns non-zero exit
        code.
      - Build log and smoke test outputs are captured to /tmp/ for review.
